[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "frontend/dist"

# VITE_API_BASE_URL still has to be set manually in Netlify's site
# settings (Site configuration -> Environment variables) once you know
# the backend's actual Koyeb URL — it's baked in at build time, so it
# can't be wired automatically before that URL exists.
