databases:
  - name: throughline-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  # Backend API. Handles both the per-request lazy pipeline trigger
  # (see build_paper.py's ensure_todays_data_is_fresh) and a free daily
  # pre-warm: GET /api/admin/warm runs the same refresh in the
  # background, meant to be pinged once a day by the GitHub Actions
  # workflow in .github/workflows/daily-warm.yml — a $0 stand-in for
  # Render's paid Cron Jobs feature. Set ADMIN_TRIGGER_KEY below to a
  # random string and put the same value in the GitHub repo secret of
  # the same name.
  - name: throughline-api
    type: web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: throughline-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false  # set manually in the Render dashboard — your Groq API key
      - key: ADMIN_TRIGGER_KEY
        sync: false  # set to a random string; must match the GitHub Actions secret of the same name

  # Frontend static site. VITE_API_BASE_URL has to be set manually
  # after the first deploy, once you know throughline-api's actual
  # onrender.com URL (see deployment notes) — it's baked in at build
  # time, so it can't be wired automatically before that URL exists.
  - name: throughline-frontend
    type: web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # set to https://throughline-api.onrender.com (or whatever it's actually named) after the API service exists
