name: Daily pipeline warm-up

# Free stand-in for Render's paid Cron Jobs feature — pings the
# deployed backend's admin trigger once a day so the shared story pool
# is usually already refreshed before any real visitor shows up. See
# api.py's /api/admin/warm and render.yaml for the other half of this.
#
# Requires two repo settings (Settings -> Secrets and variables -> Actions):
#   - Variable BACKEND_URL: e.g. https://throughline-api.onrender.com
#   - Secret   ADMIN_TRIGGER_KEY: same random string set on the Render service

on:
  schedule:
    - cron: "0 6 * * *"  # 6:00 AM UTC daily — adjust to taste
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend refresh
        run: curl -fsS --max-time 30 "${{ vars.BACKEND_URL }}/api/admin/warm?key=${{ secrets.ADMIN_TRIGGER_KEY }}"
